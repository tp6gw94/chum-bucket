assert:
  - type: javascript
    value: file://l1.mjs
    metric: L1
    config:
      minCriteria: 10
      styleChecks: forbidden
      unresolved: required
      observations: ["原味司康", "NT$100", "NT$0", "購物車還是空的"]
      allowedPaths: ["/"]
  - type: llm-rubric
    metric: L2
    value: criteria covers each of the seven 驗收條件 items and the three UI 驗收條件 items, with ids that keep the functional and UI groups distinguishable.
  - type: llm-rubric
    metric: L2
    value: Cases that use the cart's increase/decrease controls first reach the cart page with a semantic link click (for example the 購物車 navigation link); they do not assume those controls exist on /.
  - type: llm-rubric
    metric: L2
    value: Targets do not claim a page ("on the product page") that the case's actions never reached.
  - type: llm-rubric
    metric: L2
    value: The quantity-limit criterion tests both edges, decreasing at 0 and adding past 5, and observes the resulting quantity rather than a disabled state.
  - type: llm-rubric
    metric: L2
    value: The subtotal criterion checks at least two quantities with literal subtotals (for example NT$200 and NT$500).
  - type: llm-rubric
    metric: L2
    value: UI criteria are deferred because no design is bound, and their expectations copy UI 規格 values exactly (for example #284D3B, #173C29, 45%, 375px and 1280px).
  - type: llm-rubric
    metric: L2
    value: No criterion or case covers FETM-79 checkout or order-completion pages.
  - type: llm-rubric
    metric: L2
    value: unresolved records that the product and cart page routes are undefined and that the add-to-cart feedback text and navigation cart-count format are unspecified.
  - type: llm-rubric
    metric: L2
    value: No navigate action uses an invented path such as /cart or /product.
