description: Login form rejects a wrong password and an empty email

metadata:
  id: S01-login-wrong-password
  difficulty: simple
  category: negative
  intent: Basic negative-path planning with fill actions and a URL check against an unknown origin.

vars:
  summary: 依 EVAL-101 規劃登入頁錯誤提示的測試
  goal: 驗證登入頁的錯誤提示
  sources:
    - reference: { kind: jira, issueKey: EVAL-101 }
      text: |
        EVAL-101 登入頁錯誤提示

        ## 背景

        使用者登入失敗時目前沒有任何提示，需補上錯誤訊息。

        ## 驗收條件

        - AC-1：登入頁路徑為 `/login`。輸入 Email「user@example.com」與密碼「wrong-password」後點擊「登入」，表單上方顯示「帳號或密碼錯誤」，且頁面仍停留在 `/login`。
        - AC-2：登入頁 Email 欄位空白時點擊「登入」，Email 欄位下方顯示「請輸入 Email」。
      links: []

assert:
  - type: javascript
    value: file://l1.mjs
    metric: L1
    config:
      executable: [AC-1, AC-2]
      literals:
        AC-1: ["帳號或密碼錯誤"]
        AC-2: ["請輸入 Email"]
      allowedPaths: ["/login"]
  - type: llm-rubric
    metric: L2
    value: AC-1 fills the email and password fields with the literal values from the requirement before clicking 登入.
  - type: llm-rubric
    metric: L2
    value: The "still on /login" part of AC-1 uses a url observation with comparison contains, because the target origin is unknown at planning time.
  - type: llm-rubric
    metric: L2
    value: AC-1 and AC-2 are in separate cases, because checks observe only the final state of a case.
  - type: llm-rubric
    metric: L2
    value: The plan does not add login-success or other scenarios that the requirements do not mention.
