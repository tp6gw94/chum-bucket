description: Product search results, no results, empty query and trimming

metadata:
  id: M03-product-search
  difficulty: medium
  category: negative
  intent: Search scenarios that need a no-result case, an empty-query case and a whitespace-trimming case.

vars:
  summary: 依 EVAL-203 規劃商品列表頁搜尋功能的測試
  goal: 驗證商品列表頁的搜尋功能
  sources:
    - reference: { kind: jira, issueKey: EVAL-203 }
      text: |
        EVAL-203 商品列表頁：關鍵字搜尋

        ## 驗收條件

        - AC-1：商品列表頁 `/products` 初次開啟時，結果數量文字顯示「共 24 件商品」。
        - AC-2：在搜尋框輸入「司康」並點擊「搜尋」，結果數量文字顯示「共 3 件商品」。
        - AC-3：搜尋無結果時（例如輸入「xyz」），顯示「找不到符合「xyz」的商品」。
        - AC-4：搜尋框空白時點擊「搜尋」，顯示全部商品，結果數量文字為「共 24 件商品」。
        - AC-5：搜尋關鍵字前後的空白會被忽略。
      links: []

assert:
  - type: javascript
    value: file://l1.mjs
    metric: L1
    config:
      executable: [AC-1, AC-2, AC-3, AC-4, AC-5]
      literals:
        AC-1: ["共 24 件商品"]
        AC-2: ["共 3 件商品"]
        AC-3: ["找不到符合「xyz」的商品"]
        AC-4: ["共 24 件商品"]
        AC-5: ["共 3 件商品"]
      allowedPaths: ["/products"]
  - type: llm-rubric
    metric: L2
    value: AC-5 fills a keyword with leading and trailing spaces (for example "  司康  ") and expects the same 共 3 件商品 result.
  - type: llm-rubric
    metric: L2
    value: AC-3 keeps the nested quotation marks in the expected message exactly.
  - type: llm-rubric
    metric: L2
    value: The plan does not invent sorting, pagination or filtering checks.
